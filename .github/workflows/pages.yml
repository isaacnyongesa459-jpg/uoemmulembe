name: Validate UOEM GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uoem-pages-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate static pages and API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build static pages
        run: python3 scripts/build_site.py
      - name: Check HTML links, assets and budget figures
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Validate checked-in JSON sources
        run: python3 -c "import json; from pathlib import Path; [json.loads(Path(p).read_text(encoding='utf-8')) for p in ['src/pages.json', 'data/gallery-manifest.json', 'data/donation-client-config.json', 'data/proposed-budget-2026-27.json', 'manifest.json']]"
      - name: Set up Node.js for Opportunities API
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: opportunities/api/package-lock.json
      - name: Install Opportunities API dependencies
        working-directory: opportunities/api
        run: npm ci
      - name: Test Opportunities API without database writes
        working-directory: opportunities/api
        run: npm test
      - name: Check Opportunities API JavaScript syntax
        run: find opportunities/api/src opportunities/api/test -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
